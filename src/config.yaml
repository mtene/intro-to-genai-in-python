## Predefined configuration sets - to be referenced below

# remote LLM authentication via API key stored in an env var
api_key_authentication: &api_key_authentication_settings
  type: env_var_secret
  env_var_name: OPENAI_API_KEY

# Catalog of language service providers and deployments
providers:
  local_ollama:
    endpoint: http://127.0.0.1:11434/v1
    deployments:
      llm:
        name: granite4:7b-a1b-h
      snowflake-arctic-embed:
        name: snowflake-arctic-embed:m-long
  remote_openai:
    endpoint: "https://<your-endpoint>/v1"
    extra_headers:
    authentication:
      <<: *api_key_authentication_settings
    deployments:
      gpt-4o:
        name: gpt-4o
      text-embedding-3-small:
        name: text-embedding-3-small

# configuration for a local vector store service
local_vectordb: &local_vectordb_settings
  type: local

## App configuration settings

# minimum level for log messages to be displayed
# choose between:
# - debug
# - info
# - warning
# - error
# - fatal
log_level: info

observability_config:
  # OpenTelemetry HTTP ingestion endpoint
  endpoint: http://localhost:3000/api/public/otel/v1/traces
  # Langfuse OTLP ingestion uses HTTP Basic auth, based on a
  # public and private key pair. Set env vars to read the keys at runtime.
  langfuse_public_key_env_var: LANGFUSE_PUBLIC_KEY
  langfuse_secret_key_env_var: LANGFUSE_SECRET_KEY

llm_config:
  provider: local_ollama
  deployment: llm

embeddings_config:
  provider: local_ollama
  deployment: snowflake-arctic-embed

# choose one of the predefined vector store service configs from above:
# - local_vectordb_settings - a locally-hosted service
vectordb_config:
  <<: *local_vectordb_settings
